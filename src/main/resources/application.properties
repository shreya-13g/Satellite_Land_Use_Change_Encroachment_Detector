# Satellite Land Use Change and Encroachment Detector
# Application Configuration Defaults
app.name=Satellite Land Use Change and Encroachment Detector
app.version=1.0.0-SNAPSHOT
app.environment=production

# Geospatial Intelligence Defaults
geospatial.default.gsd.meters=10.0
geospatial.tile.size=256
geospatial.crs=EPSG:32643
geospatial.utm.zone=43N

# Change Detection Thresholds
change.detection.default.threshold=35.0
change.detection.min.region.area=30
change.detection.use.otsu=false

# Encroachment Screening Rules
encroachment.confidence.threshold=0.75
encroachment.min.alert.area.sqm=500.0
encroachment.buffer.distance.meters=50.0
