# Application configuration for Satellite Land Use Change and Encroachment Detector
app.name=Satellite Land Use Change and Encroachment Detector
app.version=1.0.0
app.environment=development
app.config.path=configs/pipeline-config.json

# Geospatial parameters
geospatial.default.gsd.meters=10.0
geospatial.tile.size=256
geospatial.encroachment.min.area.sqm=500.0

# Logging
logging.level.com.satellite=DEBUG
